# Shema portova za sve lokalne Docker aplikacije: web 30xx, API 80xx, baza 54xx (xx = broj aplikacije).
# gold-tracker = 60: web 3060 (i s kućne mreže), API 127.0.0.1:4100 (zadržan), baza nije izložena.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gold_tracker
      POSTGRES_USER: gold_tracker
      POSTGRES_PASSWORD: change-me
    volumes:
      - gold_tracker_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gold_tracker
      DB_USER: gold_tracker
      DB_PASSWORD: change-me
      PORT: 4100
    ports:
      - "127.0.0.1:4100:4100"

  frontend:
    build: ./frontend
    container_name: gold-tracker
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3060:80"

volumes:
  gold_tracker_db_data:
