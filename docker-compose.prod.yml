services:
  db:
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold_tracker -d gold_tracker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gold_tracker
      POSTGRES_USER: gold_tracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env (vidi .env.example)}
    volumes:
      - gold_tracker_db_data:/var/lib/postgresql/data

  backend:
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    image: ghcr.io/simebarisic/gold-tracker-backend:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gold_tracker
      DB_USER: gold_tracker
      DB_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env (vidi .env.example)}
      PORT: 4100
    ports:
      - "4100:4100"

  frontend:
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    image: ghcr.io/simebarisic/gold-tracker-frontend:latest
    pull_policy: always
    container_name: gold-tracker
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  gold_tracker_db_data:
